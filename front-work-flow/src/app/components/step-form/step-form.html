<form class="step-form" [formGroup]="stepForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="name">Nom de l'étape</label>
    <input id="name" formControlName="name" placeholder="Ex: Envoi SMS de bienvenue">
  </div>

  <div class="field">
    <label for="type">Type</label>
    <select id="type" formControlName="type">
      <option value="" disabled>-- Select Type --</option>
      @for(t of availableTypes(); track t) {
        <option [value]="t">{{ t }}</option>
      }
    </select>
  </div>

  <div class="transitions">
    <div class="transition-group">
      <p class="transition-title success">Si succès</p>
      @for(step of scenarioService.scenario().filter((s) => s.id !== scenarioService.selectedStepId()); track step.id) {
        <label class="checkbox-row">
          <input type="checkbox" [value]="step.id" [checked]="selectedSuccessIds().includes(step.id)" (change)="toggleSuccess(step.id)">
          <span>{{ step.name }}</span>
        </label>
      }
    </div>

    <div class="transition-group">
      <p class="transition-title failure">Si échec</p>
      @for(step of scenarioService.scenario().filter((s) => s.id !== scenarioService.selectedStepId()); track step.id) {
        <label class="checkbox-row">
          <input type="checkbox" [value]="step.id" [checked]="selectedFailureIds().includes(step.id)" (change)="toggleFailure(step.id)">
          <span>{{ step.name }}</span>
        </label>
      }
    </div>
  </div>

  <button class="btn btn-primary" type="submit">Submit</button>
</form>
